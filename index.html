 52% {box-shadow:0 0 0 3px var(--pulso-fraco);transform:scale(1)}
 100%{box-shadow:0 0 0 3px var(--pulso-fraco);transform:scale(1)}}

": "<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px\"><div data-navof-aula=\"a01\" style=\"background:#6B2D8C;border-radius:14px;padding:13px 15px;color:#fff\"><div style=\"font-size:16px;font-weight:900;letter-spacing:1px;opacity:.85\">AULA 01</div><div style=\"font-size:18px;font-weight:900;line-height:1.25;margin:4px 0 6px\">Estruturando meu jogo</div><div style=\"font-size:16px;line-height:1.4;border-top:1px solid rgba(255,255,255,.35);padding-top:6px\">COM COMPUTADOR · as listas e as variáveis do placar · 24 telas</div></div><div data-navof-aula=\"a02\" style=\"background:#1B5E7A;border-radius:14px;padding:13px 15px;color:#fff\"><div style=\"font-size:16px;font-weight:900;letter-spacing:1px;opacity:.85\">AULA 02</div><div style=\"font-size:18px;font-weight:900;line-height:1.25;margin:4px 0 6px\">Jogando a primeira rodada</div><div style=\"font-size:16px;line-height:1.4;border-top:1px solid rgba(255,255,255,.35);padding-top:6px\">COM COMPUTADOR · o se... senão e as três rodadas · 18 telas</div></div><div data-navof-aula=\"a03\" style=\"background:#1B7A3A;border-radius:14px;padding:13px 15px;color:#fff\"><div style=\"font-size:16px;font-weight:900;letter-spacing:1px;opacity:.85\">AULA 03</div><div style=\"font-size:18px;font-weight:900;line-height:1.25;margin:4px 0 6px\">Jogando 3 rodadas</div><div style=\"font-size:16px;line-height:1.4;border-top:1px solid rgba(255,255,255,.35);padding-top:6px\">COM COMPUTADOR · a função adiciona pontos · 19 telas</div></div><div data-navof-aula=\"a04\" style=\"background:#8A5A00;border-radius:14px;padding:13px 15px;color:#fff\"><div style=\"font-size:16px;font-weight:900;letter-spacing:1px;opacity:.85\">AULA 04</div><div style=\"font-size:18px;font-weight:900;line-height:1.25;margin:4px 0 6px\">Definindo o total do placar</div><div style=\"font-size:16px;line-height:1.4;border-top:1px solid rgba(255,255,255,.35);padding-top:6px\">COM COMPUTADOR · calcula o vencedor e o reúso · 23 telas</div></div></div>"}, {"t": "aviso", "tipo": "bom", "tit": "O projeto", "itens": ["Um <b>placar de campeonato</b> entre duas equipes, no StartLab.", "Quem joga digita o placar de cada rodada. São <b>três rodadas</b>.", "No fim, o jogo anuncia quem venceu ou se deu empate."]}, {"t": "aviso", "tipo": "cuidado", "tit": "Regra da unidade", "itens": ["Cada aula começa de onde a anterior parou. Não pule aula.", "A entrega final é na <b>Aula 04</b>."]}], "foco": true}, {"cod": "OBJS", "rot": "Objetivos", "titulo": "O que você vai aprender na Aula 01", "forma": "ident", "modo": "construir", "blocos": [{"t": "objetivos"}, {"t": "aviso", "tipo": "bom", "tit": "Habilidades da BNCC nesta unidade", "itens": ["<b>(EF07CO03)</b> Construir soluções computacionais de problemas de diferentes áreas do conhecimento, de forma individual e colaborativa, selecionando as estruturas de dados e técnicas adequadas.", "<b>(EF07CO05)</b> Criar algoritmos fazendo uso da decomposição e do reúso no processo de solução, e automatizá-los usando uma linguagem de programação."]}], "foco": true}, {"cod": "S.01", "rot": "Lição 01", "titulo": "De onde a gente parte", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "olho", "x": "Esta é a <b>primeira aula</b> da unidade. O projeto começa agora, do zero."}, {"t": "figura", "rot": "o que a gente vai construir", "html": "<p>Um <b>placar de campeonato</b>. Quem joga digita quantos gols cada equipe fez em cada rodada, e o jogo vai somando os pontos.</p><p>São <b>três rodadas</b>. No fim, o jogo diz quem ganhou.</p>"}, {"t": "aviso", "tipo": "bom", "tit": "A regra de pontos da Copa do Mundo", "itens": ["Quem faz <b>mais gols</b> na partida ganha <b>3 pontos</b>.", "Se as duas equipes fazem <b>a mesma quantidade</b> de gols, cada uma ganha <b>1 ponto</b>.", "Quem faz <b>menos gols</b> não ganha ponto nenhum."]}, {"t": "figura", "rot": "um exemplo", "html": "<p>Brasil 8 × 4 Alemanha.</p><p>O Brasil fez mais gols, então fica com <b>3 pontos</b>. A Alemanha fica com <b>0</b>.</p><p>Foram muitos gols, mas o que decide a pontuação é só <b>quem fez mais</b>.</p>"}, {"t": "conf", "itens": ["Entendi como funciona a pontuação: 3, 1 ou 0"]}, {"t": "rapida", "peso": "treino", "v": "Na fase de grupos, o empate dá 1 ponto para cada equipe.", "f": "Na fase de grupos, o empate não dá ponto para ninguém.", "exp": "Empate vale 1 ponto para cada lado. Só a derrota fica com zero.", "v2": "Vitória 3, empate 1, derrota 0.", "f2": "Só quem ganha pontua.", "bloom": "B1"}], "foco": true, "obj": 0}, {"cod": "S.02", "rot": "Lição 02 🔑 ESSENCIAL", "titulo": "O palco: campo de futebol e a narradora", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "mouse", "x": "Agora o StartLab. Você vai trocar o cenário e trocar o personagem."}, {"t": "passo", "n": "1", "tit": "Abrir o projeto e trocar o cenário", "itens": [["mouse", "No Alura, abra a atividade do projeto e clique em <span class=\"ui\">Iniciar meu projeto</span>."], ["mouse", "No canto de baixo à direita, clique em <span class=\"ui\">Escolher um cenário</span>."], ["mouse", "Procure e escolha o cenário <span class=\"ui\">Campo de futebol</span>."], ["olho", "O palco fica verde, com a trave e a arquibancada."]]}, {"t": "passo", "n": "2", "tit": "Trocar o personagem pela narradora", "itens": [["mouse", "Clique no ícone de lixeira no ator <span class=\"ui\">Code</span> para removê-lo."], ["mouse", "Clique em <span class=\"ui\">Escolher um ator</span> e procure <span class=\"ui\">Pixy</span>."], ["mouse", "Arraste a Pixy para o <b>lado esquerdo</b> do palco."], ["olho", "No projeto do instrutor a Pixy está em x = -180 e y = -27."]]}, {"t": "aviso", "tipo": "cuidado", "tit": "Por que a narradora existe", "itens": ["Quem joga <b>não vê o código</b>. A narradora é quem conversa com o jogador.", "Ela é quem vai perguntar o placar de cada rodada.", "Você pode escolher outro personagem. O nome muda, o trabalho é o mesmo."]}, {"t": "conf", "itens": ["Troquei o cenário para campo de futebol", "Removi o Code e coloquei a narradora", "A narradora está do lado esquerdo do palco"]}], "foco": true, "obj": 0}, {"cod": "OP1", "rot": "Objetivo 1", "titulo": "Objetivo conquistado", "forma": "los", "modo": "construir", "blocos": [{"t": "opcard", "aula": "a01", "i": 0, "prox": 1}], "foco": true}, {"cod": "S.03", "rot": "Lição 03 🔑 ESSENCIAL", "titulo": "A lista de países", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "olho", "x": "O placar é uma tabela. O StartLab não tem tabela, mas tem <b>listas</b>."}, {"t": "figura", "rot": "o que é uma lista", "html": "<p>Uma lista guarda <b>vários valores</b>, um em cada posição: posição 1, posição 2, posição 3.</p><p>Três listas lado a lado funcionam como três colunas de uma tabela.</p>"}, {"t": "passo", "n": "1", "tit": "Criar a lista Países", "itens": [["mouse", "Na coluna da esquerda, clique na categoria <span class=\"ui\">Variáveis</span>."], ["mouse", "Clique em <span class=\"ui\">Criar uma Lista</span>."], ["teclado", "Escreva <b>Países</b> e confirme."], ["mouse", "Arraste a lista para o centro do palco."]]}, {"t": "passo", "n": "2", "tit": "Colocar as duas equipes", "itens": [["mouse", "No palco, clique no <b>+</b> que fica embaixo da lista."], ["teclado", "Na posição 1, escreva <b>Brasil</b>."], ["mouse", "Clique no <b>+</b> de novo."], ["teclado", "Na posição 2, escreva <b>Alemanha</b>."]]}, {"t": "aviso", "tipo": "bom", "tit": "Você pode escolher outras equipes", "itens": ["Brasil e Alemanha são o exemplo da aula.", "Se você quiser outro esporte e outras equipes, pode.", "Só não mude os nomes no meio do caminho: o resto do código conta com eles."]}, {"t": "conf", "itens": ["Criei a lista Países", "A lista tem Brasil na posição 1 e Alemanha na posição 2"]}], "foco": true, "obj": 1}, {"cod": "S.04", "rot": "Lição 04 ✋ VOCÊ FAZ", "titulo": "As listas de pontos e de gols", "forma": "quad", "modo": "construir", "blocos": [{"t": "acao", "ico": "mouse", "x": "Agora as outras duas colunas da tabela. O caminho é o mesmo."}, {"t": "passo", "n": "1", "tit": "Criar a lista Pontos", "itens": [["mouse", "Em <span class=\"ui\">Variáveis</span>, clique em <span class=\"ui\">Criar uma Lista</span>."], ["teclado", "Escreva <b>Pontos</b> e confirme."], ["mouse", "Arraste a lista para o palco, do lado da lista Países."], ["mouse", "Clique no <b>+</b> duas vezes e deixe <b>0</b> nas duas posições."]]}, {"t": "passo", "n": "2", "tit": "Criar a lista Gols", "itens": [["mouse", "Repita o caminho: <span class=\"ui\">Criar uma Lista</span>, nome <b>Gols</b>."], ["mouse", "Arraste para o palco, do lado da lista Pontos."], ["mouse", "Clique no <b>+</b> duas vezes e deixe <b>0</b> nas duas posições."]]}, {"t": "aviso", "tipo": "bom", "tit": "Por que tudo começa em zero", "itens": ["Ninguém jogou ainda. O placar de um jogo que não começou é 0 a 0.", "Cada lista fica com <b>comprimento 2</b>, uma posição para cada equipe."]}, {"t": "conf", "itens": ["Criei a lista Pontos com 0 e 0", "Criei a lista Gols com 0 e 0", "As três listas estão visíveis no palco"]}], "foco": true, "obj": 1}, {"cod": "S.05", "rot": "Lição 05", "titulo": "A ordem das listas é o que faz o placar funcionar", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "olho", "x": "Este é o ponto mais importante da aula. Leia com calma."}, {"t": "figura", "rot": "<span class=\"lupamk\" title=\"imagem da plataforma\">🔎</span> COMO FICA NA TELA · CENÁRIO · as três listas no palco", "img": "a01-palco", "alt": "o palco com o campo de futebol, a narradora e as três listas lado a lado", "origem": "original"}, {"t": "figura", "rot": "a regra", "html": "<p>A posição <b>1</b> da lista Países é o Brasil.</p><p>Então a posição <b>1</b> de Pontos e a posição <b>1</b> de Gols também são do Brasil.</p><p>O mesmo vale para a posição 2, que é a Alemanha.</p>"}, {"t": "aviso", "tipo": "perigo", "tit": "O erro que quebra o placar", "itens": ["Se você trocar a ordem em <b>uma</b> lista e não trocar nas outras, o placar passa a mostrar o resultado errado.", "O jogo continua funcionando. Ele só dá a vitória para a equipe errada.", "Por isso: mudou a ordem em uma lista, muda nas três."]}, {"t": "conf", "itens": ["Entendi que a posição 1 é sempre a mesma equipe nas três listas"]}, {"t": "rapida", "peso": "treino", "v": "A posição do item é o que liga as três listas entre si.", "f": "As três listas funcionam sozinhas, sem relação entre elas.", "exp": "É a posição que amarra país, pontos e gols da mesma equipe.", "v2": "Posição 1 nas três listas é sempre a mesma equipe.", "f2": "Cada lista é independente e a ordem não importa.", "bloom": "B4"}], "foco": true, "obj": 1}, {"cod": "S.06", "rot": "Lição 06 🔑 ESSENCIAL", "titulo": "Zerar o placar quando o jogo começa", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "olho", "x": "Um problema aparece ao testar: a cada clique na bandeira, as listas <b>crescem</b>."}, {"t": "figura", "rot": "por que isso acontece", "html": "<p>O bloco <span class=\"bloco-cod b-var\">adicione ( ) a (Pontos)</span> sempre <b>acrescenta</b> uma posição nova.</p><p>Clicou três vezes na bandeira, a lista ficou com seis posições.</p><p>A gente quer sempre <b>duas</b>. Então apaga antes de adicionar.</p>"}, {"t": "passo", "n": "1", "tit": "Montar o evento da bandeira", "itens": [["mouse", "Na categoria <span class=\"ui\">Eventos</span>, arraste <span class=\"bloco-cod b-evt\">quando 🏳 for clicado</span>."], ["mouse", "Em <span class=\"ui\">Variáveis</span>, arraste <span class=\"bloco-cod b-var\">apague todos os itens de (Pontos)</span> para baixo dele."], ["mouse", "Arraste outro igual e troque a lista para <b>Gols</b>."]]}, {"t": "passo", "n": "2", "tit": "Recolocar os quatro zeros", "itens": [["mouse", "Arraste <span class=\"bloco-cod b-var\">adicione (0) a (Pontos)</span> e encaixe embaixo."], ["mouse", "Arraste outro igual, também para <b>Pontos</b>."], ["mouse", "Agora dois blocos <span class=\"bloco-cod b-var\">adicione (0) a (Gols)</span>."], ["olho", "São seis blocos embaixo da bandeira: dois apagam, quatro colocam zero."]]}, {"t": "figura", "rot": "<span class=\"lupamk\" title=\"reconstruído\">🏗️</span> o conjunto montado", "html": "<div style=\"display:flex;flex-direction:column;gap:7px\"><div style=\"margin-left:0px;font-size:17px;line-height:1.6\"><span class=\"bloco-cod b-evt\">quando 🏳 for clicado</span></div><div style=\"margin-left:22px;font-size:17px;line-height:1.6\"><span class=\"bloco-cod b-var\">apague todos os itens de (Pontos)</span></div><div style=\"margin-left:22px;font-size:17px;line-height:1.6\"><span class=\"bloco-cod b-var\">apague todos os itens de (Gols)</span></div><div style=\"margin-left:22px;font-size:17px;line-height:1.6\"><span class=\"bloco-cod b-var\">adicione (0) a (Pontos)</span></div><div style=\"margin-left:22px;font-size:17px;line-height:1.6\"><span class=\"bloco-cod b-var\">adicione (0) a (Pontos)</span></div><div style=\"margin-left:22px;font-size:17px;line-height:1.6\"><span class=\"bloco-cod b-var\">adicione (0) a (Gols)</span></div><div style=\"margin-left:22px;font-size:17px;line-height:1.6\"><span class=\"bloco-cod b-var\">adicione (0) a (Gols)</span></div></div><div class=\"legenda-blocos\"><span class=\"b-evt\">Eventos</span><span class=\"b-ctr\">Controle</span><span class=\"b-var\">Variáveis</span><span class=\"b-sen\">Sensores</span><span class=\"b-apa\">Aparência</span><span class=\"b-ope\">Operadores</span><span class=\"b-meu\">Meus Blocos</span></div>", "origem": "reconstruido"}, {"t": "figura", "rot": "<span class=\"lupamk\" title=\"imagem da plataforma\">🔎</span> COMO FICA NA TELA · ATOR · PIXY", "img": "a01-inicializa", "alt": "o conjunto de blocos da inicialização, do jeito que aparece no StartLab", "origem": "original"}, {"t": "aviso", "tipo": "cuidado", "tit": "Clique na Pixy antes de montar", "itens": ["No StartLab, <b>cada ator tem a sua própria área de código</b>.", "Se a área aparecer vazia, você está no ator errado. Clique na Pixy e o código volta."]}, {"t": "conf", "itens": ["Montei o evento da bandeira com os seis blocos", "Testei: cliquei na bandeira e as listas continuam com duas posições"]}], "foco": true, "obj": 1}, {"cod": "OP2", "rot": "Objetivo 2", "titulo": "Objetivo conquistado", "forma": "los", "modo": "construir", "blocos": [{"t": "opcard", "aula": "a01", "i": 1, "prox": 2}], "foco": true}, {"cod": "S.07", "rot": "Lição 07", "titulo": "A narradora dá o comando", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "mouse", "x": "Quem joga precisa saber o que fazer. Quem avisa é a narradora."}, {"t": "passo", "n": "1", "tit": "Fazer a Pixy falar", "itens": [["mouse", "Confira que a Pixy está selecionada."], ["mouse", "Em <span class=\"ui\">Aparência</span>, arraste <span class=\"bloco-cod b-apa\">diga (Olá!) por (2) segundos</span>."], ["mouse", "Encaixe logo abaixo do <span class=\"bloco-cod b-evt\">quando 🏳 for clicado</span>."], ["teclado", "Troque o texto por: <b>Vamos jogar 3 rodadas! Digite o placar de cada jogo.</b>"]]}, {"t": "figura", "rot": "<span class=\"lupamk\" title=\"reconstruído\">🏗️</span> como fica", "html": "<div style=\"display:flex;flex-direction:column;gap:7px\"><div style=\"margin-left:0px;font-size:17px;line-height:1.6\"><span class=\"bloco-cod b-evt\">quando 🏳 for clicado</span></div><div style=\"margin-left:22px;font-size:17px;line-height:1.6\"><span class=\"bloco-cod b-apa\">diga (Vamos jogar 3 rodadas! Digite o placar de cada jogo.) por (2) segundos</span></div></div>", "origem": "reconstruido"}, {"t": "conf", "itens": ["A narradora fala o comando quando eu clico na bandeira"]}], "foco": true, "obj": 2}, {"cod": "S.08", "rot": "Lição 08 🔑 ESSENCIAL", "titulo": "Perguntar o placar", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "olho", "x": "Agora a narradora <b>pergunta</b>, e o jogo espera a resposta."}, {"t": "passo", "n": "1", "tit": "A pergunta do Brasil", "itens": [["mouse", "Na categoria <span class=\"ui\">Sensores</span>, arraste <span class=\"bloco-cod b-sen\">pergunte (Qual é o seu nome?) e espere</span>."], ["mouse", "Encaixe embaixo do bloco de fala."], ["teclado", "Troque o texto por <b>Brasil:</b>"]]}, {"t": "passo", "n": "2", "tit": "A pergunta da Alemanha", "itens": [["mouse", "Arraste outro <span class=\"bloco-cod b-sen\">pergunte ( ) e espere</span>."], ["teclado", "Escreva <b>Alemanha:</b>"], ["olho", "Ainda não encaixe este segundo. Falta uma coisa entre os dois."]]}, {"t": "aviso", "tipo": "bom", "tit": "O que o e espere faz", "itens": ["Sem o <b>e espere</b>, o jogo faria as duas perguntas de uma vez.", "Com ele, o jogo para e aguarda quem está jogando digitar."]}, {"t": "conf", "itens": ["Coloquei a pergunta do Brasil embaixo da fala", "Criei a pergunta da Alemanha"]}], "foco": true, "obj": 2}, {"cod": "S.09", "rot": "Lição 09 🔑 ESSENCIAL", "titulo": "Duas caixas para guardar os gols", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "olho", "x": "A resposta que o jogador digita precisa ser <b>guardada</b> em algum lugar."}, {"t": "figura", "rot": "o que é uma variável", "html": "<p>Variável é uma <b>caixa com nome</b>. Você guarda um valor dentro, e pode trocar esse valor quando quiser.</p><p>Pense numa mochila: hoje tem um caderno, amanhã tem outro. A mochila é a mesma, o conteúdo muda.</p>"}, {"t": "passo", "n": "1", "tit": "Criar as duas variáveis", "itens": [["mouse", "Em <span class=\"ui\">Variáveis</span>, clique em <span class=\"ui\">Criar uma Variável</span>."], ["teclado", "Escreva <b>gols do Brasil</b> e confirme."], ["mouse", "Clique em <span class=\"ui\">Criar uma Variável</span> de novo."], ["teclado", "Escreva <b>gols da Alemanha</b> e confirme."]]}, {"t": "aviso", "tipo": "cuidado", "tit": "Nome de variável não é enfeite", "itens": ["O nome serve para <b>você</b> entender o código depois.", "Se você chamar de <i>sorvete</i>, o jogo funciona, mas ninguém entende o que ela guarda.", "Nome bom é o  ATOR · PIXY", "img": "a03-inicializa", "alt": "a inicialização da Aula 03, zerando as variáveis e recriando as listas", "origem": "original"}, {"t": "aviso", "tipo": "bom", "tit": "Por que isso é boa prática", "itens": ["Todo programa que guarda informação precisa começar num <b>estado conhecido</b>.", "Sem zerar, a partida de hoje começa com o resultado da partida de ontem.", "Vale para jogo, para caixa de mercado e para qualquer sistema que some."]}, {"t": "conf", "itens": ["As duas variáveis de gols são zeradas na bandeira", "As listas continuam sendo apagadas e recriadas"]}], "foco": true, "obj": 2}, {"cod": "S.09", "rot": "Lição 09", "titulo": "Testar de novo · agora soma", "forma": "play", "modo": "construir", "blocos": [{"t": "acao", "ico": "mouse", "x": "O mesmo teste das duas vezes anteriores. Agora o resultado muda."}, {"t": "passo", "n": "1", "tit": "Conferir a acumulação", "itens": [["mouse", "Clique na bandeira verde."], ["teclado", "Primeira rodada: Brasil <b>6</b>, Alemanha <b>2</b>. O Brasil fica com <b>3</b>."], ["teclado", "Segunda rodada: Brasil <b>5</b>, Alemanha <b>5</b>."], ["olho", "Agora o Brasil vai para <b>4</b> pontos. 3 da vitória mais 1 do empate."]]}, {"t": "aviso", "tipo": "bom", "tit": "O que você conseguiu nesta aula", "itens": ["Criou um comando seu, com duas entradas.", "Usou o mesmo comando quatro vezes, com valores diferentes.", "Consertou um bug que existia desde a aula passada."]}, {"t": "conf", "itens": ["Testei e a pontuação agora acumula", "Cada nova partida começa zerada"]}], "foco": true, "obj": 2}, {"cod": "OP3", "rot": "Objetivo 3", "titulo": "Objetivo conquistado", "forma": "los", "modo": "construir", "blocos": [{"t": "opcard", "aula": "a03", "i": 2, "prox": 3}], "foco": true}, {"cod": "DUPLA3", "rot": "Pausa da dupla", "titulo": "Pare e confira com o seu parceiro", "forma": "pausa", "modo": "construir", "blocos": [{"t": "intro", "x": "Um minuto com quem está do seu lado. Esta aula tem um detalhe pequeno que decide tud p": "Um estudante percebeu que o mesmo conjunto de blocos era usado várias vezes em seu projeto para atualizar a pontuação das equipes. Para deixar o programa mais organizado, ele decidiu criar uma função chamada <b>adiciona pontos</b>.<br><br>Por que essa decisão ajuda na organização do código?", "a": [["A", "Porque a mesma função pode ser chamada em diferentes momentos, evitando repetir os mesmos blocos."], ["B", "Porque toda função executa o programa mais rapidamente, independentemente do que ela faz."], ["C", "Porque uma função elimina a necessidade de usar condições durante a programação."], ["D", "Porque criar uma função faz com que todas as variáveis sejam atualizadas automaticamente."]], "dica": "<span class=\"nd\">Você acabou de fazer isso: trocou quatro blocos iguais por quatro chamadas da mesma função.</span><span class=\"nd\">Na sua Lição 05 a função entrou <b>dentro</b> das condições, então ela não elimina condição nenhuma. Uma alternativa cai aí.</span><span class=\"nd\">Sobraram duas além da certa: uma promete deixar o programa mais <b>rápido</b>, outra promete atualizar variáveis <b>sozinho</b>. Nenhuma das duas aconteceu no seu projeto.</span>", "e": "As funções permitem reutilizar um mesmo conjunto de instruções, deixando o código mais organizado e mais fácil de mudar depois — porque você muda num lugar só. <b>Marque esta mesma alternativa no Alura, pela descrição · nunca pela letra.</b>"}]}], "foco": true, "obj": 2}, {"cod": "ATV3.2", "rot": "📋 ATIVIDADE · 2 de 3", "titulo": "Responda e marque a mesma no Alura", "forma": "circc", "modo": "responder", "blocos": [{"t": "atv", "card": "05", "nome": "Atividade 2 de 3 · AULA 03", "ctx": "As três questões desta aula são as da plataforma. Responda aqui primeiro e depois registre no Alura.", "qs": [{"oficial": true, "deg": "D05 · ESPELHAR", "bloom": "B4", "seg": 10, "c": 3, "p": "Um estudante criou um sistema de pontos para um jogo de futebol. Depois de duas rodadas, percebeu que a lista não acumulava a pontuação: o valor novo ficava no lugar do antigo.<br><br>Analise as afirmações:<br>I) Apagar todos os itens da lista após cada rodada ajuda a manter a pontuação acumulada.<br>II) Usar apenas a nova pontuação na atualização mantém o histórico de pontos.<br>III) Trocar a posição do participante na lista corrige a soma dos pontos.<br>IV) Substituir o item pelo valor antigo somado aos novos pontos evita perder a pontuação anterior.<br><br>Quais afirmativas estão corretas?", "a": [["A", "I e II."], ["B", "I e III."], ["C", "II e IV."], ["D", "Apenas IV."]], "dica": "<span class=\"nd\">Comece pela afirmação <b>IV</b>: é exatamente o que você montou na Lição 07. Ela está certa.</span><span class=\"nd\">Agora a <b>I</b>: apagar a lista a cada rodada joga fora tudo o que já foi somado. Toda alternativa que inclui a I cai.</span><span class=\"nd\">Sobrou decidir entre duas. A <b>II</b> diz que usar <b>só</b> a nova pontuação mantém o histórico — foi justamente isso que causou o bug.</span>", "e": "Para acumular pontos é preciso considerar o valor já registrado e somar a nova pontuação. Só a afirmação IV descreve isso. <b>Marque esta mesma alternativa no Alura, pela descrição · nunca pela letra.</b>"}]}], "foco": true, "obj": 2}, {"cod": "ATV3.3", "rot": "📋 ATIVIDADE · 3 de 3", "titulo": "Responda e marque a mesma no Alura", "forma": "circc", "modo": "responder", "blocos": [{"t": "atv", "card": "05", "nome": "Atividade 3 de 3 · AULA 03", "ctx": "As três questões desta aula são as da plataforma. Responda aqui primeiro e depois registre no Alura.", "qs": [{"oficial": true, "deg": "D05 · ESPELHAR", "bloom": "B4", "seg": 10, "c": 2, "p": "Em um projeto de festival de dança, a lista de pontuação deve acumular os pontos de cada apresentação. Porém, a cada nova rodada, a pontuação antiga desaparece e fica apenas a mais recente.<br><br>O que pode estar causando esse problema?", "a": [["A", "O programa está somando os pontos novos com os pontos antigos da lista."], ["B", "O programa está usando uma variável para guardar a nota dos jurados."], ["C", "O programa está substituindo o item da lista sem considerar o valor anterior."], ["D", "O programa está repetindo as rodadas antes de perguntar a nova pontuação."]], "dica": "<span class=\"nd\">É o mesmo bug que você consertou nesta aula. Procure a alternativa que descreve a <b>causa</b>, não a solução.</span><span class=\"nd\">Uma das alternativas descreve justamente o conserto, não o problema: somar o novo com o antigo é o que faz funcionar.</span><span class=\"nd\">Das que sobraram, guardar a nota numa variável e repetir rodadas não apagam valor de lista nenhum.</span>", "e": "Quando o item é substituído sem somar o valor anterior, a pontuação acumulada se perde. É exatamente o que acontecia antes de você colocar o operador de soma dentro da função. <b>Marque esta mesma alternativa no Alura, pela descrição · nunca pela letra.</b>"}]}], "foco": true, "obj": 2}, {"cod": "PLACAR3", "rot": "Placar", "titulo": "O seu placar na Aula 03", "forma": "premio", "modo": "responder", "blocos": [{"t": "placar"}], "foco": true}]}, {"ch": "a04", "nome": "AULA 04", "cor": "#8A5A00", "titulo": "Definindo o total do placar", "objetivos": [["Identificar padrões no código", "A mesma estrutura resolvendo coisas diferentes"], ["Organizar a solução em funções", "calcula o placar e calcula o vencedor"], ["Fechar o projeto completo", "O jogo anuncia quem venceu"]], "telas": [{"cod": "OBJS4", "rot": "Objetivos", "titulo": "O que você vai aprender na Aula 04", "forma": "ident", "modo": "construir", "blocos": [{"t": "objetivos"}], "foco": true}, {"cod": "S.01", "rot": "Lição 01", "titulo": "De onde a gente parou", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "olho", "x": "O seu jogo já registra os gols e já soma os pontos certo, rodada a rodada."}, {"t": "figura", "rot": "o que falta", "html": "<p>Depois das três rodadas, o jogo <b>não diz quem venceu</b>.</p><p>Hoje você fecha o projeto: o jogo vai an ope\">Operadores</span><span class=\"b-meu\">Meus Blocos</span></div>", "origem": "reconstruido"}, {"t": "aviso", "tipo": "bom", "tit": "O que você ganhou com isso", "itens": ["O roteiro principal ficou curto e dá para ler de uma vez.", "Cada função tem <b>uma tarefa só</b>, e o nome diz qual é.", "Quem abrir o seu projeto entende o que ele faz sem ler bloco por bloco."]}, {"t": "conf", "itens": ["Criei a função calcula o placar", "A lógica do se está dentro dela", "A chamada está dentro do repita, depois das perguntas"]}], "foco": true, "obj": 1}, {"cod": "OP2", "rot": "Objetivo 2", "titulo": "Objetivo conquistado", "forma": "los", "modo": "construir", "blocos": [{"t": "opcard", "aula": "a04", "i": 1, "prox": 2}], "foco": true}, {"cod": "S.08", "rot": "Lição 08", "titulo": "Um problema que os testes revelam", "forma": "play", "modo": "construir", "blocos": [{"t": "acao", "ico": "mouse", "x": "Teste o jogo inteiro e olhe a lista <b>Gols</b>."}, {"t": "aviso", "tipo": "perigo", "tit": "A lista de gols está sempre zerada", "itens": ["Os pontos acumulam certo. Os gols continuam 0 e 0.", "Não é bug de encaixe: <b>nunca existiu</b> código para atualizar essa lista.", "As variáveis guardam os gols da rodada, mas ninguém leva esse número para a lista."]}, {"t": "figura", "rot": "pense antes de virar a tela", "html": "<p>Você já tem uma função que soma valor numa lista: o <span class=\"bloco-cod b-meu\">adiciona pontos</span>.</p><p>Como você faria a mesma coisa para a lista Gols?</p>"}, {"t": "conf", "itens": ["Testei e vi que a lista Gols fica zerada", "Entendi que falta código para atualizar essa lista"]}], "foco": true, "obj": 2}, {"cod": "S.09", "rot": "Lição 09 🔑 ESSENCIAL", "titulo": "A função adiciona gols", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "olho", "x": "Aqui você aproveita o que já existe e faz três ajustes."}, {"t": "passo", "n": "1", "tit": "Criar o bloco com as entradas", "itens": [["mouse", "Em <span class=\"ui\">Meus Blocos sso", "n": "2", "tit": "Repetir para a segunda equipe", "itens": [["mouse", "Pegue outro <span class=\"bloco-cod b-meu\">adiciona gols ( ) ( )</span>."], ["mouse", "Encaixe depois de guardar os gols da segunda equipe."], ["teclado", "Na posição, escreva <b>2</b>."], ["mouse", "Coloque <span class=\"bloco-cod b-sen\">resposta</span> no segundo espaço."]]}, {"t": "aviso", "tipo": "cuidado", "tit": "A posição tem de bater com a lista Países", "itens": ["Posição <b>1</b> é a primeira equipe da lista. Posição <b>2</b> é a segunda.", "Trocar isso faz o jogo somar os gols de uma equipe na linha da outra."]}, {"t": "conf", "itens": ["Chamei adiciona gols com posição 1 depois da primeira pergunta", "Chamei adiciona gols com posição 2 depois da segunda pergunta"]}], "foco": true, "obj": 2}, {"cod": "S.11", "rot": "Lição 11", "titulo": "O projeto completo", "forma": "play", "modo": "construir", "blocos": [{"t": "acao", "ico": "mouse", "x": "Último teste. Agora tudo junto."}, {"t": "passo", "n": "1", "tit": "Jogar as três rodadas", "itens": [["mouse", "Clique na bandeira verde."], ["teclado", "Digite três placares diferentes, um por rodada."], ["olho", "A lista Pontos acumula. A lista Gols acumula."], ["olho", "No fim, a narradora anuncia o vencedor ou o empate."]]}, {"t": "figura", "rot": "<span class=\"lupamk\" title=\"imagem da plataforma\">🔎</span> COMO FICA NA TELA · o projeto inteiro", "img": "a04-completo", "alt": "o código completo da Aula 04, com calcula o placar, calcula o vencedor e as duas funções de somar", "origem": "original"}, {"t": "figura", "rot": "<span class=\"lupamk\" title=\"imagem da plataforma\">🔎</span> COMO FICA NA TELA · CENÁRIO · o placar no fim da partida", "img": "a04-palco", "alt": "o palco com as três listas preenchidas ao fim das três rodadas", "origem": "original"}, {"t": "aviso", "tipo": "bom", "tit": "Você usou funções por dois motivos", "itens": ["<b>Reúso</b> · a mesma função chamada em momentos diferentes, com dados diferentes.", "<b>Organização</b> · cada função com uma tarefa, e o roteiro principal curto.", "Cada função tem um nome que diz o que ela faz. Isso é para quem lê o código depois."]}, {"t": "conf", "itens": ["O placar acumula pontos e gols nas três rodadas", "O jogo anuncia o vencedor no fim", "Salvei o projeto"]}], "foco": true, "obj": 2}, {"cod": "OP3", "rot": "Objetivo 3", "titulo": "Objetivo conquistado", "forma": "los", "modo": "construir", "blocos": [{"t": "opcard", "aula": "a04", "i": 2, "prox": 3}], "foco": true}, {"cod": "DUPLA4", "rot": "Pausa da dupla", "titulo": "Pare e confira com o seu parceiro", "forma": "pausa", "modo": "construir", "blocos": [{"t": "intro", "x": "Última pausa da unidade. Esta aula tem quatro funções, e é onde mais aparece função criada mas nunca chamada."}, {"t": "conf", "itens": ["Conferimos se as quatro funções existem nos dois projetos", "Conferimos se todas foram chamadas no roteiro da bandeira", "Os dois jogaram as três rodadas até o anúncio do vencedor"]}, {"t": "aviso", "tipo": "bom", "tit": "O que olhar no código do colega", "itens": ["Se o <span class=\"bloco-cod b-meu\">calcula o vencedor</span> está <b>fora</b> do repita.", "Se o <span class=\"bloco-cod b-meu\">adiciona gols</span> usa a lista Gols nos <b>dois</b> lugares.", "Nunca mexa no computador do colega. Aponte e explique."]}], "foco": true}, {"cod": "DESAF4", "rot": "Hora do desafio 🎯 DESAFIO", "titulo": "A mensagem de encerramento", "forma": "estrela", "modo": "construir", "blocos": [{"t": "intro", "x": "Último desafio da unidade. Este é de criatividade."}, {"t": "figura", "rot": "o desafio", "html": "<p>Adicione uma <b>mensagem de encerramento</b> para deixar o campeonato mais completo.</p><ul style='font-size:18px'><li>A narradora agradece a quem jogou, depois do resultado final.</li><li>Escreva um texto seu, relacionado ao campeonato.</li><li>Deixe a mensagem visível por alguns segundos.</li><li>Teste até o fim e veja se ela aparece <b>depois</b> do resultado.</li></ul>"}, {"t": "aviso", "tipo": "bom", "tit": "Onde encaixar", "itens": ["Depois da chamada de <span class=\"bloco-cod b-meu\">calcula o vencedor</span>, no roteiro da bandeira.", "Se encaixar antes, a mensagem aparece antes do resultado."]}, {"t": "conf", "itens": ["A narradora agradece no fim da partida", "A mensagem aparece depois do anúncio do vencedor"]}], "foco": true, "obj": 2}, {"cod": "ATV4.1", "rot": "📋 ATIVIDADE · 1 de 3", "titulo": "Responda e marque a mesma no Alura", "forma": "circc", "modo": "responder", "blocos": [{"t": "atv", "card": "05", "nome": "Atividade 1 de 3 · AULA 04", "ctx": "As três questões desta aula são as da plataforma. Responda aqui primeiro e depois registre no Alura.", "qs": [{"oficial": true, "deg": "D05 · ESPELHAR", "bloom": "B4", "seg": 10, "c": 0, "p": "Uma estudante está desenvolvendo um aplicativo para uma biblioteca da escola. Para organizar o código, ela criou as funções <b>registrar empréstimo</b>, <b>registrar devolução</b> e <b>atualizar estoque</b>. Cada uma realiza uma tarefa diferente, mas todas seguem a mesma forma de organização.<br><br>O que mostra o padrão utilizado na criação dessas funções?", "a": [["A", "Cada função reúne uma tarefa específica e pode ser chamada quando essa tarefa precisa ser executada."], ["B", "Todas as funções modificam exatamente as mesmas informações do sistema."], ["C", "Todas as funções precisam ter o mesmo nome para funcionar corretamente."], ["D", "Cada função substitui completamente o código principal do programa."]], "dica": "<span class=\"nd\">É o mesmo padrão das suas funções: calcula o placar, calcula o vencedor e adiciona gols.</span><span class=\"nd\">Os nomes do enunciado são todos diferentes. A alternativa que exige nomes iguais cai sozinha.</span><span class=\"nd\">Das que sobraram, uma diz que as funções mexem nas <b>mesmas</b> informações, outra que a função <b>substitui</b> o roteiro principal. No seu projeto o roteiro principal continua lá, chamando cada função.</span>", "e": "Organizar o p nção atualiza a sua lista, enquanto os parâmetros indicam a posição e a quantidade. É a mesma divisão das suas funções adiciona pontos e adiciona gols. <b>Marque esta mesma alternativa no Alura, pela descrição · nunca pela letra.</b>"}]}], "foco": true, "obj": 2}, {"cod": "ATV4.3", "rot": "📋 ATIVIDADE · 3 de 3", "titulo": "Coloque os blocos na ordem certa", "forma": "circc", "modo": "responder", "blocos": [{"t": "atv", "card": "05", "nome": "Atividade 3 de 3 · AULA 04", "ctx": "As três questões desta aula são as da plataforma. Responda aqui primeiro e depois registre no Alura.", "qs": [{"tipo": "ordem", "oficial": true, "deg": "D05 · ESPELHAR", "bloom": "B4", "seg": 12, "p": "Em uma gincana de vôlei, dois participantes acumulam pontos durante várias rodadas. Ao final, o programa precisa usar uma função para comparar os pontos e mostrar uma mensagem com o resultado.<br><br>Coloque os blocos na <b>sequência correta</b>:", "banco": ["Comparar a pontuação final dos participantes", "Chamar a função depois que as rodadas terminarem", "Criar a função que calcula o vencedor", "Exibir a mensagem com o resultado da disputa"], "gab": ["Criar a função que calcula o vencedor", "Comparar a pontuação final dos participantes", "Exibir a mensagem com o resultado da disputa", "Chamar a função depois que as rodadas terminarem"], "dica": "<span class=\"nd\">Pense na ordem em que <b>você</b> fez nesta aula: o que veio primeiro, criar a função ou usá-la?</span><span class=\"nd\">Chamar a função só faz sentido depois que ela existe e já sabe o que fazer. Então essa é a última.</span><span class=\"nd\">Sobraram comparar e exibir. O programa precisa saber o resultado antes de poder anunciá-lo.</span>", "e": "Primeiro a função é criada, depois compara os pontos, mostra o resultado e por fim precisa ser chamada no momento certo. Foi exatamente o caminho das Lições 03 a 06. <b>Marque esta mesma alternativa no Alura, pela descrição · nunca pela letra.</b>"}]}], "foco": true, "obj": 2}, {"cod": r-radius:0 12px 12px 0;padding:12px 15px;margin:0 0 11px\"><div style=\"font:800 16px/1.5 var(--mono);color:#6E6E6E\">ATIVIDADE 3 · múltipla escolha</div><div style=\"font-size:17px;font-weight:900;color:#14532D;margin:4px 0 6px\">Armazenar a informação digitada para uso em outras partes do sistema.</div><div style=\"font-size:17px;line-height:1.55\">A variável guarda a informação para o programa usar depois. É exatamente o que você fez com <b>gols do Brasil</b> e <b>gols da Alemanha</b> na Lição 10. <b>Marque esta mesma alternativa no Alura, pela descrição · nunca pela letra.</b></div></div><div style=\"font:800 17px/1.5 var(--mono);color:#fff;background:#1B5E7A;border-radius:11px;padding:7px 14px;margin:14px 0 10px\">AULA 02 · Jogando a primeira rodada</div><div style=\"border:3px solid #D8D2E6;border-left-width:9px;border-left-color:#1B5E7A;border-radius:0 12px 12px 0;padding:12px 15px;margin:0 0 11px\"><div style=\"font:800 16px/1.5 var(--mono);color:#6E6E6E\">ATIVIDADE 1 · múltipla escolha</div><div style=\"font-size:17px;font-weight:900;color:#14532D;margin:4px 0 6px\">Verificar se os acertos da equipe Vermelha são maiores que os da equipe Azul.</div><div style=\"font-size:17px;line-height:1.55\">Comparar a quantidade de acertos das duas equipes é o que permite descobrir qual venceu. É a mesma comparação que você montou com o operador <b>maior que</b>. <b>Marque esta mesma alternativa no Alura, pela descrição · nunca pela letra.</b></div></div><div style=\"border:3px solid #D8D2E6;border-left-width:9px;border-left-color:#1B5E7A;border-radius:0 12px 12px 0;padding:12px 15px;margin:0 0 11px\"><div style=\"font:800 16px/1.5 var(--mono);color:#6E6E6E\">ATIVIDADE 2 · sequência</div><div style=\"font-size:17px;font-weight:900;color:#14532D;margin:4px 0 6px\">Verificar o resultado da rodada · Consultar a pontuação atual da equipe · Somar os novos pontos à pontuação atual · Atualizar o valor na lista de pontuações</div><div style=\"font-size:17px;line-height:1.55\">A function pendencias(i){ try{ return _pend(i) }catch(e){ return ["algo não carregou nesta tela · avise o professor"] } }
function _pend(i){
 var t = el(TELAS[i].id), f = [];
 if(!t) return f;
 if(!ler("visto_"+TELAS[i].id,0)) f.push("abrir esta tela e ler o que tem nela");
 if(el("gNome") && t.querySelector("#gNome")){
  if(!el("gNome").value.trim()) f.push("escrever o seu nome e sobrenome");
  if(!document.querySelector(".tm.on")) f.push("escolher a sua turma");
 }
 t.querySelectorAll('[data-obrig="1"]').forEach(function(c){
  if(!c.value.trim()){
   var l = t.querySelector('label[for="'+c.id+'"]');
   f.push("preencher: "+(l?l.textContent:"um campo"));
  }
 });
 t.querySelectorAll("[data-cop]").forEach(function(b){
  if(!b.classList.contains("feito")) f.push("clicar no botão Copiar de “"+b.querySelector(".cab2 span").textContent+"”");
 });
 if(P.glossario_pastilha){
  var np = t.querySelectorAll(".termo-cod:not(.lido)").length;
  if(np) f.push("ler "+np+" pastilha(s) de glossário desta tela");
 }
 t.querySelectorAll(".conf").forEach(function(c){
  c.querySelectorAll("input.cf").forEach(function(x){
   if(!x.checked) f.push("marcar: "+x.parentNode.textContent.trim());
  });
 });
 t.querySelectorAll(".rapida").forEach(function(r){
  if(r.getAttribute("data-fim")!=="1") f.push("responder a perguntinha desta tela");
 });
 t.querySelectorAll(".atv").forEach(function(box){
  var n = box.querySelectorAll('.aq:not([data-fim="1"])').length;
  if(n) f.push("responder "+n+" pergunta(s) da atividade oficial");
 });
 t.querySelectorAll(".senhabox").forEach(function(box){
  if(!box.classList.contains("aberta")) f.push("esperar o professor liberar esta tela");
 });
 t.querySelectorAll(".verif").forEach(function(box){
  var n = box.querySelectorAll('.vq:not([data-fim="1"])').length;
  if(n) f.push("responder "+n+" pergunta(s) da verificação");
 });
 return f;
}

function mostra(i){

 var t = TELAS[atual];

 var m = MODOS[t.modo], box = el("modo");
 box.className = "modo "+m[0];
 box.innerHTML = m[1]+" <small>"+m[2]+"</small>";
 el("tagaula").textContent = t.nome;
 el("tagaula").style.background = t.cor;
 el("conta").textContent = "tela "+(atual+1)+" de "+TELAS.length;
 el("tdesc").textContent = t.rot+" · "+t.titulo;
 el("tdesc").title = t.rot+" · "+t.titulo;
 el("bVolta").disabled = (atual===0);
 var bA = el("bAvanca");
 if(atual === TELAS.length-1){ bA.textContent = "✔ Terminei"; bA.classList.add("fim") }
 else { bA.textContent = "Avançar →"; bA.classList.remove("fim") }
 tIni = Date.now();
 grav("visto_"+t.id,1);
 pintaPessoas();
 pintaSugestoes();
 pintaEco();
 pintaFalta();
 trilha(); pintaObjetivos(t.aula); placar(); credencial(); pintaCartao(); pintaFalta(); pend(); grav("tela",atual);
 window.scrollTo(0,0);
}

  abre('<h3 style="color:#C0392B">Falta uma coisa</h3>'
   + '<p>A tela <b>'+(p+1)+' · '+t.titulo+'</b> ficou pela metade. Falta:</p><ul style="font-size:17px">'
   + f.map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>"
   + '<button class="btn prim" onclick="FACA.ir('+p+')">Ir para essa tela</button>'
   + '<button class="btn" onclick="FACA.fecha()">Fechar</button>');

  + '<button class="btn" onclick="FACA.fecha()">Fechar</button>');
}

   ============================================================ */
function ligaPastilhas(){
 if(!P.glossario_pastilha) return;
 document.querySelectorAll(".termo-cod").forEach(function(p){
  var chave = p.getAttribute("data-t");
  if(ler("glos_"+chave,0)) p.classList.add("lido");
  p.addEventListener("click",function(){
   var g = D.glossario[chave], alvo = this;
   if(!g) return;
   abre('<h3>'+g.t+'</h3>'+(g.en?'<p style="margin:0;color:#5B6B7C;font-size:16px">'+g.en+'</p>':"")
    + '<div class="cxtabs"><button class="cxtab on" data-p="0">o que é</button>'
    + '<button class="cxtab" data-p="1" disabled>para que serve</button>'
    + '<button class="cxtab" data-p="2" disabled>exemplo</button></div>'
    + '<div class="cxpane on" data-pane="0">'+g.oq+'</div>'
    + '<div class="cxpane" data-pane="1">'+g.pra+'</div>'
    + '<div class="cxpane" data-pane="2">'+g.ex+'</div>'
    + '<button class="btn prim" id="bFechar" disabled>Fechar</button>');
   function segundosDoTexto(txt){
    var n = String(txt||"").replace(/<[^>]+>/g," ").split(/\s+/).filter(Boolean).length;
    return Math.max(3, Math.min(6, Math.round(n/7)));
   }
   function liberaProxima(p){
    var prox = document.querySelector('.cxtab[data-p="'+(p+1)+'"]');
    if(prox){ prox.disabled = false; prox.classList.add("livre") }
   }
   function travaAba(p){
    var pane = document.querySelector('[data-pane="'+p+'"]');
    var seg = segundosDoTexto(pane ? pane.innerHTML : "");
    var prox = document.querySelector('.cxtab[data-p="'+(p+1)+'"]');
    if(prox && !prox.classList.contains("livre")) prox.disabled = true;
    setTimeout(function(){
     if(!document.querySelector('[data-pane="'+p+'"]')) return;
     liberaProxima(p);
     if(p === 2 && el("bFechar")){ el("bFechar").disabled = false; el("bFechar").textContent = "Fechar ✓" }
    }, seg*1000);
   }
   document.querySelectorAll(".cxtab").forEach(function(tb){
    tb.addEventListener("click",function(){
     if(this.disabled) return;
     document.querySelectorAll(".cxtab").forEach(function(x){x.classList.remove("on")});
     document.querySelectorAll(".cxpane").forEach(function(x){x.classList.remove("on")});
     this.classList.add("on");
     document.querySelector('[data-pane="'+this.getAttribute("data-p")+'"]').classList.add("on");
     travaAba(+this.getAttribute("data-p"));
    });
   });
   var b = el("bFechar"), vistas = {"0":1};
   function confereAbas(){
    var n = Object.keys(vistas).length;
    if(n < 3){ b.disabled = true; b.textContent = "leia as 3 abas · faltam " + (3-n) }
    else if(b.disabled){ b.textContent = "leia com calma…" }
   }
   document.querySelectorAll(".cxtab").forEach(function(tb){
    tb.addEventListener("click", function(){
     vistas[this.getAttribute("data-p")] = 1;
     this.classList.add("visto");
     confereAbas();
    });
   });
   document.querySelector('.cxtab[data-p="0"]').classList.add("visto");
   confereAbas();
   travaAba(0);
   b.addEventListener("click",function(){
    alvo.classList.add("lido"); grav("glos_"+chave,1); fecha(); pend(); pintaFalta();
   });
  });
 });
}

 var n = t.querySelectorAll(".termo-cod:not(.lido)").length;

 {

function media(a){if(!a.length)return null;var s=0;a.forEach(function(x){s+=x});return s/a.length*10}
function notaAula(ch){
 var B = pt(ch), w = D.pesos, n = 0, den = 0;
 var mc = media(B.conferencia), mt = media(B.treino), ma = media(B.atv);
 if(mc!==null){n += mc*w.conferencia; den += w.conferencia}
 if(mt!==null){n += mt*w.treino; den += w.treino}
 if(ma!==null){n += ma*w.atv; den += w.atv}
 return den ? n/den : 0;
}
function faixa(n){
 if(n>=9) return ["f-azul","PREMIAÇÃO"];
 if(n>=7) return ["f-verde","VENCEU"];
 if(n>=5) return ["f-ambar","ATENÇÃO"];
 return ["f-vermelho","REFAZER"];
}

   + '<tr><td>Programação · produção</td><td>'+(w.producao*100)+'%</td><td>fechada pelo professor</td></tr>'
   + (P.atv_nav07?'<tr><td>Atividade oficial</td><td>'+(w.atv*100)+'%</td><td>'+fmt(ma)+'</td></tr>':"")
   + (P.kahoot?'<tr><td>Kahoot dos slides</td><td>'+(w.kahoot*100)+'%</td><td>–</td></tr>':"")
   + '<tr><td>Verificação de treino</td><td>'+(w.treino*100)+'%</td><td>'+fmt(mt)+'</td></tr>'
   + '<tr><td>Perdido por pressa</td><td>—</td><td class="neg">'
   + (B.pressa ? ("−"+B.pressa.toFixed(1).replace(".",",")+" ponto · "+(B.pressa*2)+" resposta(s) sem leitura")

   + '<div class="aviso cuidado" style="margin-top:16px"><b class="tit">Antes de chamar o professor</b><ul>'

.it .llfalta{opacity:.85}

/* ---- v05.01 · o card da lista nao some mais ----
   A regra antiga era:
     .it.trav{opacity:1 !important;background:#fff !important}
   "background" e atalho: escreve os oito campos de fundo de uma vez e

   color:#fff herdado de .it[class*="ln-"], o card virava branco no

   Prefixo #cx: identificador vence classe, entao a regra nao depende

   opacity:1 para todos: o estado pendente ja esta na caixa .itok e no
   texto "faltam N itens", na mesma linha do card.
   Achado e corrigido no N.05.01.02.04 · CLD-003 a CLD-005.

#cx .it.trav{opacity:1 !important;background-color:#fff !important}
#cx .it[class*="ln-"]{border-color:var(--c3) !important}


/* ---- v04.00 · pulso do VOCE FAZ e vibracao do ESSENCIAL ---- */
.it.ln-faz .ptl{animation:fazPulsa 1.9s ease-in-out infinite}
@keyframes fazPulsa{
 0%{transform:scale(1);box-shadow:0 0 0 0 rgba(193,18,31,.55)}
 55%{transform:scale(1.07);box-shadow:0 0 0 12px rgba(193,18,31,0)}
 100%{transform:scale(1);box-shadow:0 0 0 0 rgba(193,18,31,0)}}

@keyframes vibra{
 0%,86%,100%{transform:translateX(0)}
 88%{transform:translateX(-2.5px)} 90%{transform:translateX(2.5px)}
 92%{transform:translateX(-2px)}   94%{transform:translateX(2px)}
 96%{transform:translateX(-1px)}   98%{transform:translateX(1px)}}
.passo{position:relative}
.ptfaz-card{position:absolute;top:-16px;right:12px;z-index:3;

 border:3px solid #C1121F;background:#fff;color:#C1121F;white-space:nowrap;
 animation:fazPulsa 1.9s ease-in-out infinite}
.ptfaz-card.feito{animation:none;border-color:#1B7A3A;color:#1B7A3A}
@media (prefers-reduced-motion:reduce){
 .it.ln-faz .ptl,.it.ln-ess,.ptfaz-card{animation:none}}


/* ---- v05.00 · pontuacao geral e refazer (modelo FACA-PYTHON CLD-085) ---- */
#pg_geral .pgnota{font:900 54px/1.1 var(--mono);color:var(--fc,#4A2C7D);text-align:center}
#pg_geral .pgrot{text-align:center;font:800 18px/1.5 var(--mono);color:var(--fc,#4A2C7D);
  letter-spacing:.06em;text-transform:uppercase;margin:2px 0 4px}
#pg_geral .pgmsg{text-align:center;font-size:17px;color:#33414F;margin:0 0 14px}
#pg_geral .lgeral{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  border:3px solid #D8D2E6;border-radius:12px;padding:11px 14px;margin:0 0 9px;font-size:17px}
#pg_geral .lga{font-weight:900;color:#4A2C7D}
#pg_geral .lgb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pg_geral .notinha{display:inline-block;min-width:54px;text-align:center;border:3px solid var(--fc);
  color:var(--fc);border-radius:10px;padding:2px 10px;font:900 18px/1.4 var(--mono)}
#pg_geral .rfb{border:3px solid #C1121F;background:#fff;color:#C1121F;border-radius:11px;
  padding:8px 14px;font:800 17px/1.3 inherit;cursor:pointer}
#pg_geral .rfb:hover{background:#FCEBEC}
#pg_geral .fcont{margin-top:10px;font:800 16px/1.6 var(--mono);color:#5A6B7B;text-align:center}
</style>
<script>
/* ============================================================
   CAMADA NAV.OF V05.01 · complemento do motor-faca v1.31
   O motor roda dentro de um IIFE e nao expoe nada. Esta camada
   NAO altera o motor: ela intercepta o clique na fase de captura,
   antes de chegar ao botao, e so deixa passar quando a questao
   deve realmente fechar. Pontuacao, placar e gravacao continuam
   sendo feitos pelo motor, sem copia nenhuma aqui.
   1 · quatro tentativas na atividade oficial objetiva
   2 · tres dicas graduadas, uma por erro
   3 · caixa de conferido na lista de telas
   4 · linha colorida por tipo na lista (degrade com verniz)
   ============================================================ */
(function(){
"use strict";

function ligaNavOf(){
 document.querySelectorAll(".atv .aq:not(.ord):not(.vf)").forEach(function(q){
  if(q.getAttribute("data-navof") === "1") return;
  q.setAttribute("data-navof","1");
  if(q.getAttribute("data-fim") === "1") return;

  var c = +q.getAttribute("data-c");
  var cxd = q.querySelector(".adica");
  var dicas = cxd ? [].slice.call(cxd.querySelectorAll(".nd")) : [];
  if(cxd && dicas.length){
   cxd.classList.add("navof-dicas");
   dicas.forEach(function(d){ d.classList.add("nd-off") });
   cxd.style.display = "none";
  }
  var tt = document.createElement("div");
  tt.className = "otent";
  tt.textContent = "tentativa 1 de 4";
  q.appendChild(tt);

  var t = 0;
  q.addEventListener("click", function(e){
   var b = e.target;
   while(b && b !== q && !(b.classList && b.classList.contains("aalt"))) b = b.parentNode;
   if(!b || b === q || b.disabled) return;
   if(q.getAttribute("data-fim") === "1") return;

   var alts = [].slice.call(q.querySelectorAll(".aalt"));
   var ai = alts.indexOf(b);
   t++;

   if(ai === c || t >= 4){
    setTimeout(function(){
     tt.textContent = (ai === c)
       ? ("acertou na tentativa " + t + " de 4")
       : "as quatro tentativas foram usadas";
     if(cxd && dicas.length){
      cxd.style.display = "";
      dicas.forEach(function(d){ d.classList.remove("nd-off") });
     }
    }, 0);
    return;                       /* deixa o motor fechar e pontuar */
   }

   e.stopPropagation();
   e.preventDefault();
   b.classList.add("errada");
   b.disabled = true;
   if(cxd && dicas[t-1]){
    cxd.style.display = "";
    dicas[t-1].classList.remove("nd-off");
   }
   tt.textContent = "tentativa " + (t+1) + " de 4";
  }, true);
 });
}

var TIPOS = [
 ["ATIVIDADE", "ln-atv", "📋 ATIVIDADE"],
 ["ESSENCIAL", "ln-ess", "🔑 ESSENCIAL"],
 ["VOCÊ FAZ",  "ln-faz", "✋ VOCÊ FAZ"],
 ["DESAFIO",   "ln-des", "🎯 DESAFIO"]
];

function arrumaLista(){
 var telas = document.querySelectorAll(".palco .tela");
 document.querySelectorAll(".it[data-ir2]").forEach(function(it){
  if(it.getAttribute("data-navof") === "1") return;
  it.setAttribute("data-navof","1");

  var ck = it.querySelector(".ck");
  if(ck){
   var feito = ck.textContent.indexOf("✅") >= 0;
   var cx = document.createElement("span");
   cx.className = "itok";
   cx.innerHTML = "&#10003;";
   ck.parentNode.replaceChild(cx, ck);
   if(feito) it.classList.add("visto");
  }

  var i = +it.getAttribute("data-ir2"), rot = "";
  var sec = telas[i];
  if(sec){
   var cod = sec.querySelector(".cod");
   if(cod) rot = cod.textContent || "";
  }
  for(var n = 0; n < TIPOS.length; n++){
   if(rot.toUpperCase().indexOf(TIPOS[n][0]) >= 0){
    it.classList.add(TIPOS[n][1]);
    var p = document.createElement("span");
    p.className = "ptl";
    p.textContent = TIPOS[n][2];
    var tx = it.querySelector(".ittx");
    if(tx && tx.parentNode) tx.parentNode.insertBefore(p, tx.nextSibling);
    break;
   }
  }
 });
}


/* ---------- 5 · numeracao X.Y dos passos ---------- */
function numeraPassos(){
 document.querySelectorAll(".passo").forEach(function(p){
  if(p.getAttribute("data-navof") === "1") return;
  p.setAttribute("data-navof","1");
  var n = p.querySelector(".pnum");
  var x = n ? (n.textContent || "").trim() : "";
  if(!x) return;
  p.querySelectorAll(".psub > li").forEach(function(li, i){
   var s = document.createElement("span");
   s.className = "psn";
   s.textContent = x + "." + (i+1);
   li.insertBefore(s, li.firstChild);
  });
 });
}

/* ---------- 6 · versao real do motor no topo ---------- */
function arrumaVersao(){
 var t = document.getElementById("tver");
 if(!t) return;
 var s = t.textContent || "";
 if(s.indexOf("motor v") < 0) return;
 t.textContent = s.replace(/motor v[\d.]+/, "motor v1.31 + NAV.OF");
}

/* ---------- 7 · mapa da unidade · card leva para a aula ---------- */
function ligaMapa(){
 document.querySelectorAll("[data-navof-aula]").forEach(function(card){
  if(card.getAttribute("data-navof") === "1") return;
  card.setAttribute("data-navof","1");
  var ch = card.getAttribute("data-navof-aula");
  var telas = [].slice.call(document.querySelectorAll(".palco .tela"));
  var alvo = -1;
  for(var i = 0; i < telas.length; i++){
   if(telas[i].getAttribute("data-aula") === ch){ alvo = i; break }
  }
  if(alvo < 0) return;
  card.classList.add("navof-card");
  var ir = document.createElement("span");
  ir.className = "navof-ir";
  ir.textContent = "▸ clique para ir";
  card.appendChild(ir);
  card.addEventListener("click", function(){
   if(window.FACA && window.FACA.ir){ window.FACA.ir(alvo); return }
   var b = document.getElementById("bLista");
   if(!b) return;
   b.click();
   setTimeout(function(){
    var it = document.querySelector('.it[data-ir2="' + alvo + '"]');
    if(it) it.click();
   }, 120);
  });
 });
}


/* ---------- 8 · modo LIVRE · nenhuma tela trancada ----------
   O motor nao desabilita o botao Avancar: ele abre um aviso
   "Falta uma coisa" e nao anda. A camada intercepta o clique
   antes disso e anda pela API publica do motor.
   A identificacao continua obrigatoria: na tela 1 o clique
   passa direto para o motor.
   PROF continua false · a chave de progresso segue sendo a do
   estudante, sem sufixo de teste.                            */
var LIVRE = true;

function atualAgora(){
 var c = document.getElementById("conta");
 if(!c) return -1;
 var m = /tela\s+(\d+)\s+de\s+(\d+)/i.exec(c.textContent || "");
 return m ? [+m[1]-1, +m[2]] : -1;
}

function ligaLivre(){
 var nav = document.getElementById("nav");
 if(!nav || !LIVRE) return;
 nav.addEventListener("click", function(e){
  var b = e.target;
  while(b && b !== nav && b.id !== "bAvanca") b = b.parentNode;
  if(!b || b.id !== "bAvanca") return;
  var a = atualAgora();
  if(a === -1) return;
  if(a[0] <= 0) return;              /* identificacao · motor decide */
  if(a[0] >= a[1]-1) return;         /* ultima tela · motor decide */
  if(!(window.FACA && window.FACA.ir)) return;
  e.stopPropagation();
  e.preventDefault();
  window.FACA.ir(a[0] + 1);
 }, true);
}


/* ---------- 9 · pastilha VOCE FAZ presa ao card do passo a passo ---------- */
function pulsaFaz(){
 document.querySelectorAll(".palco .tela").forEach(function(sec){
  if(sec.getAttribute("data-navof-faz") === "1") return;
  sec.setAttribute("data-navof-faz","1");
  var cod = sec.querySelector(".cod");
  var rot = cod ? (cod.textContent || "").toUpperCase() : "";
  if(rot.indexOf("VOC\u00ca FAZ") < 0) return;
  var p = sec.querySelector(".passo");
  if(!p) return;
  var b = document.createElement("span");
  b.className = "ptfaz-card";
  b.textContent = "\u270B VOC\u00ca FAZ";
  p.appendChild(b);
  sec.addEventListener("change", function(){
   var cx = sec.querySelectorAll(".conf input[type=checkbox]");
   var ok = cx.length > 0;
   cx.forEach(function(x){ if(!x.checked) ok = false });
   b.classList.toggle("feito", ok);
  });
 });
}


/* ---------- 10 · pontuacao geral das quatro aulas, com refazer ----------
   Formato herdado do FACA-PYTHON CLD-085: nota de 0 a 10, farol de tres
   faixas, uma linha por aula e o refazer no fim da linha.
   A camada NAO guarda nota nenhuma: le o que o motor ja gravou no
   armazenamento do navegador e devolve a conta.                        */
var FAROL = [
 {max:4.9, rot:"REFAZER",           cor:"#C1121F", msg:"Vale a pena refazer. Leia com calma antes de responder."},
 {max:6.9, rot:"ATENÇÃO",           cor:"#C2760C", msg:"Você entendeu boa parte. Volte onde errou de primeira."},
 {max:10,  rot:"VENCEU O CONTEÚDO", cor:"#1B7A3A", msg:"Conteúdo dominado. Guarde o projeto para a AAIM."}
];
function far(n){ for(var i=0;i<FAROL.length;i++) if(n<=FAROL[i].max) return FAROL[i]; return FAROL[2] }
function fmt(n){ return (Math.round(n*10)/10).toString().replace(".",",") }

/* v05.01 · so as chaves DESTE arquivo.
   O motor grava com PFX = meta.prefixo + ("_TESTE_" ou "_").
   Sem o filtro, a pontuacao geral de um ano somava as respostas do
   outro e o refazer apagava as chaves dos dois, porque 6 e 7 ano
   moram no mesmo navegador da escola.
   Sem prefixo declarado no meta, a camada nao adivinha: devolve
   vazio e a tela diz que nao ha resposta ainda. */
function pfxDoArquivo(){
 try{
  var p = window.CONTEUDO && window.CONTEUDO.meta && window.CONTEUDO.meta.prefixo;
  return p ? (p + (window.PROF ? "_TESTE_" : "_")) : null;
 }catch(e){ return null }
}
function chavesAtv(){
 var r=[], p=pfxDoArquivo();
 if(!p) return r;
 try{
  for(var i=0;i<localStorage.length;i++){
   var k=localStorage.key(i);
   if(k && k.indexOf(p)===0 && k.indexOf("atv_")>=0) r.push(k);
  }
 }catch(e){}
 return r;
}

function aulaDaTela(cod){
 var sec=document.querySelectorAll(".palco .tela");
 for(var i=0;i<sec.length;i++){
  var c=sec[i].querySelector(".cod");
  if(c && (c.textContent||"").indexOf(cod)>=0) return sec[i].getAttribute("data-aula");
 }
 return null;
}

function contaAulas(){
 var por={}, ks=chavesAtv();
 ks.forEach(function(k){
  var m=/atv_([^_]+)_(\d+)$/.exec(k);
  if(!m) return;
  var a=aulaDaTela(m[1]);
  if(!a) return;
  var v=null;
  try{ v=JSON.parse(localStorage.getItem(k)) }catch(e){}
  if(!v) return;
  por[a]=por[a]||{ac:0,tot:0,chaves:[]};
  por[a].tot++;
  if(+v.pt>=1) por[a].ac++;
  por[a].chaves.push(k);
 });
 return por;
}

function pintaGeral(){
 var box=document.getElementById("pg_geral");
 if(!box) return;
 /* v05.01 · nomes lidos do conteudo, nao escritos fixos.
    Antes vinham as quatro aulas do 6 ano cravadas no codigo, e
    qualquer outro ano mostrava o titulo errado no placar geral. */
 var por=contaAulas(), aulas=[], nomes={};
 try{
  (window.CONTEUDO.aulas||[]).forEach(function(a){
   aulas.push(a.ch); nomes[a.ch]=(a.nome||a.ch)+" · "+(a.titulo||"");
  });
 }catch(e){}
 if(!aulas.length) return;
 var ac=0, tot=0, feitas=0, det="";
 aulas.forEach(function(a){
  var p=por[a];
  if(p && p.tot){
   ac+=p.ac; tot+=p.tot; feitas++;
   var n=p.ac*10/p.tot, f=far(n);
   det+='<div class="lgeral"><span class="lga">'+nomes[a]+'</span><span class="lgb">'
      + '<b class="notinha" style="--fc:'+f.cor+'">'+fmt(n)+'</b> '+p.ac+' de '+p.tot
      + ' <button class="rfb" data-refaz="'+a+'">refazer</button></span></div>';
  }else{
   det+='<div class="lgeral"><span class="lga">'+nomes[a]+'</span>'
      + '<span class="lgb">ainda não respondida</span></div>';
  }
 });
 var topo;
 if(!tot){
  topo='<div class="pgnota">–</div><div class="pgmsg">responda as atividades para ver a sua nota</div>';
 }else{
  var ng=ac*10/tot, g=far(ng);
  topo='<div class="pgnota" style="--fc:'+g.cor+'">'+fmt(ng)+'</div>'
     + '<div class="pgrot" style="--fc:'+g.cor+'">'+g.rot+'</div>'
     + '<div class="pgmsg">'+g.msg+'</div>';
 }
 box.innerHTML=topo+det+'<div class="fcont">'+feitas+' de '+aulas.length+' aulas com atividade respondida</div>';
}

function ligaRefazer(){
 document.addEventListener("click", function(e){
  var b=e.target;
  while(b && b!==document && !(b.dataset && b.dataset.refaz)) b=b.parentNode;
  if(!b || !b.dataset || !b.dataset.refaz) return;
  var a=b.dataset.refaz, por=contaAulas();
  if(!por[a]) return;
  if(!confirm("Isso apaga as respostas das atividades desta aula. O resto do seu progresso fica. Quer refazer?")) return;
  por[a].chaves.forEach(function(k){ try{ localStorage.removeItem(k) }catch(e){} });
  location.reload();
 });
}

function partida(){
 ligaNavOf();
 numeraPassos();
 arrumaVersao();
 ligaMapa();
 ligaLivre();
 pulsaFaz();
 pintaGeral();
 ligaRefazer();
 setInterval(pintaGeral, 4000);
 var alvo = document.getElementById("cx");
 if(alvo && window.MutationObserver){
  new MutationObserver(function(){ arrumaLista() }).observe(alvo, {childList:true, subtree:true});
 }
 document.addEventListener("click", function(e){
  if(e.target && e.target.id === "bLista") setTimeout(arrumaLista, 80);
 });
}

if(document.readyState === "loading"){
 document.addEventListener("DOMContentLoaded", function(){ setTimeout(partida, 0) });
}else{
 setTimeout(partida, 0);
}
})();
</script>
<style>
/* ============================================================
   CAMADA MISSOES V01.00 · N.05.01.02.04 · CLD-012
   Complementa o motor-faca v1.31 e a camada NAV.OF V05.01.
   NAO altera nenhum dos dois: e carregada depois e so acrescenta.
   Le window.CONTEUDO.missoes · nada escrito fixo, para o no irmao
   copiar trocando so o conteudo.
   ============================================================ */

/* ---- cards de missao e de escolha de modo ---- */

.mcab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px}
.mnum{font:800 16px/1.5 var(--mono);letter-spacing:.06em;color:var(--fraco)}

.mdesc{font-size:17px;line-height:1.5;flex:1}
.mir{display:block;margin-top:10px;font:800 16px/1.5 var(--mono);
  border-top:2px solid var(--borda);padding-top:8px;color:var(--aula)}

/* estados da missao */
.mcard.mlivre{border-color:var(--aula);background:var(--aulafd)}
.mcard.mlivre .mcad{display:none}
.mcard.mlivre .mnum{color:var(--aula)}

<script>
/* ============================================================

   Complemento do motor-faca v1.31 e da camada NAV.OF V05.01.

   Por que ela nao reescreve a lista do motor:
   o defeito do card invisivel (CLD-003 a CLD-005) nasceu da camada
   disputando com o motor o que ele desenha. Aqui a camada NAO monta
   item nenhum: ela esconde por CSS o que esta fora da rota e navega
   pela API publica window.FACA.ir(). O motor continua dono da lista.

   Por que ela intercepta no document, e nao no #nav:
   a NAV.OF ja intercepta o Avancar em captura no #nav, para o modo
   LIVRE. Captura vai document -> nav, entao um ouvinte de captura no
   document corre ANTES e decide primeiro. Em modo missao, esta camada
   para o evento ali e a NAV.OF nem chega a ver. Em modo aula por aula,
   ela nao faz nada e o LIVRE continua valendo, intacto.

   Tudo o que ela sabe vem de window.CONTEUDO.missoes. Nenhum codigo
   de tela, nenhum numero de aula escrito fixo: o no irmao copia este
   arquivo e troca so o conteudo.
   ============================================================ */
(function(){
"use strict";

var D = window.CONTEUDO || {};
var MIS = D.missoes || [];
if(!MIS.length) return;                       /* sem missoes, camada dorme */

var PFX = (function(){
 try{ return (D.meta && D.meta.prefixo ? D.meta.prefixo : "faca")
      + (window.PROF ? "_TESTE_" : "_") + "mis_"; }catch(e){ return "faca_mis_" }
})();

function le(k, pad){ try{ var v=localStorage.getItem(PFX+k); return v===null?pad:v }catch(e){ return pad } }
function grav(k, v){ try{ localStorage.setItem(PFX+k, v) }catch(e){} }

/* ---------- estado ---------- */
function modo(){ return le("modo", "") }                 /* "" | missoes | aulas */
function atual(){ return le("atual", "") }               /* chave da missao */
function feita(c){ return le("feita_"+c, "") === "1" }
function fecha(c){ grav("feita_"+c, "1") }
function mIndex(c){ for(var i=0;i<MIS.length;i++) if(MIS[i].chave===c) return i; return -1 }
function mDe(c){ var i=mIndex(c); return i<0?null:MIS[i] }

function liberada(i){
 if(i===0) return true;
 return feita(MIS[i-1].chave);
}

/* ---------- onde estamos ---------- */
function telaAgora(){
 var c=document.getElementById("conta");
 if(!c) return -1;
 var m=/tela\s+(\d+)\s+de\s+(\d+)/i.exec(c.textContent||"");
 return m ? (+m[1]-1) : -1;
}
function codAgora(){
 var s=document.querySelector(".palco .tela.on .cod");
 return s ? (s.textContent||"").trim() : "";
}
function vai(i){
 if(window.FACA && window.FACA.ir) window.FACA.ir(i);

}

/* O motor escreve "AULA 01 · LIÇÃO 05" no .cod, nao o codigo do JSON.
   Entao a tela-chave vem do mapa declarado no conteudo, nunca de
   procurar texto na tela. */
function iDe(chave){
 var c = D.chaves || {};
 return (chave in c) ? c[chave] : -1;
}

/* ---------- a rota da missao em andamento ----------
   V01.02 · antes de escolher o caminho, a rota e so identificar e
   escolher. O resto do arquivo fica fora de rota, escondido da
   lista. Depois da escolha:
     missoes    · vale a rota da missao
     aula a aula· rota nula, tudo liberado, LIVRE intacto           */
function preRota(){
 var a=iDe("IDENT"), b=iDe("MODO"), r=[];
 if(a>=0) r.push(a);
 if(b>=0) r.push(b);

}
function emPre(){ return modo()==="" && !!preRota() }
/* escolheu missoes mas ainda nao escolheu QUAL: a lista nao pode

function emEscolhaDeMissao(){

function rota(){

function posNaRota(){

 (D.aulas||[]).forEach(function(a){ (a.telas||[]).forEach(function(t){

/* A barra do topo do motor tem altura variavel: ela quebra linha

  }else{
   c.classList.add("mlivre");
   if(ir) ir.textContent="▸ começar esta missão";

 });
 /* escolha de modo */
 document.querySelectorAll(".mcard[data-modo]").forEach(function(c){

   return;
  }
  var m=mDe(atual());
  cab.innerHTML="Mostrando só as telas da <b>"+m.emoji+" MISSÃO "+(mIndex(m.chave)+1)
   +" · "+m.nome+"</b> — "+r.length+" telas. "
   +'<button class="btn" id="mverTudo" style="min-height:40px;padding:8px 14px;font-size:16px;margin-left:8px">ver todas as telas</button>';
  var b=document.getElementById("mverTudo");
  if(b) b.addEventListener("click", function(){
   cx.querySelectorAll(".it[data-ir2]").forEach(function(it){ it.classList.remove("mforaRota") });
   cab.innerHTML="Mostrando <b>todas</b> as telas do arquivo. A missão continua em andamento.";
  });
 }else if(cab){ cab.remove() }
}

/* ---------- conclusao da missao ---------- */
function talvezFecha(){
 if(emPre()) return false;
 var r=rota(), m=mDe(atual());
 if(!r || !m) return false;
 var p=posNaRota();
 if(p !== r.length-1) return false;
 if(feita(m.chave)) return false;
 fecha(m.chave);
 var i=mIndex(m.chave);
 var prox = (i+1 < MIS.length) ? MIS[i+1] : null;
 alert("Missão "+(i+1)+" concluída: "+m.nome+"."
   + (prox ? "\n\nA missão "+(i+2)+" · "+prox.nome+" está liberada."
           : "\n\nVocê terminou as quatro missões."));
 grav("atual", "");
 var k=iDe("MISSOES");
 if(k>=0) vai(k);
 return true;
}

/* ---------- navegacao ---------- */
function anda(passo){
 var r=rota(); if(!r) return false;
 var p=posNaRota();
 if(p<0){                                   /* saiu da rota: volta para ela */
  var perto=r[0], atualI=telaAgora();
  for(var i=0;i<r.length;i++) if(r[i]<=atualI) perto=r[i];
  vai(perto); return true;
 }
 if(emPre() && passo>0 && p===r.length-1){
  alert("Escolha um dos dois caminhos para as telas abrirem:\n"
      + "por missões ou aula por aula.");
  return true;
 }
 if(emEscolhaDeMissao() && passo>0 && p===r.length-1){
  alert("Escolha uma missão no quadro para as telas dela abrirem.");
  return true;
 }
 if(passo>0 && p===r.length-1) return talvezFecha();
 var novo=p+passo;
 if(novo<0 || novo>=r.length) return true;
 var alvo=r[novo];
 if(passo>0 && gabaritoTrancado(alvo)){
  alert("O gabarito abre depois que as "+totalAtv()+" atividades forem respondidas.\n"
       +"Respondidas até agora: "+atvRespondidas()+".");
  return true;
 }
 vai(alvo);
 return true;
}

/* ---------- pinta o Avancar quando a perguntinha trava ---------- */
function pintaAvanca(){
 var b=document.getElementById("bAvanca");
 if(!b) return;
 var trava = modo()==="missoes" && perguntaAberta();
 b.classList.toggle("mtravado", trava);
 var d=document.getElementById("mdica");
 if(trava && !d){
  d=document.createElement("div"); d.id="mdica"; d.className="mdica";
  d.textContent="Responda a pergunta desta tela para avançar.";
  var nav=document.getElementById("nav"); if(nav) nav.appendChild(d);
 }else if(!trava && d){ d.remove() }
}

/* ---------- um ciclo ---------- */
function ciclo(){
 faixa(); pintaCards(); avisoFora(); pintaAvanca();
}

/* ---------- ligacoes ---------- */
function partida(){
 /* escolha de modo e escolha de missao */
 document.addEventListener("click", function(e){
  var c=e.target;
  while(c && c!==document && !(c.classList && c.classList.contains("mcard"))) c=c.parentNode;
  if(!c || c===document || !c.classList.contains("mcard")) return;

  if(c.hasAttribute("data-modo")){
   var md=c.getAttribute("data-modo");
   grav("modo", md);
   grav("atual", "");
   e.stopPropagation(); e.preventDefault();
   var k=iDe(md==="missoes" ? "MISSOES" : "MAPA");
   if(k>=0) vai(k);
   setTimeout(ciclo,60);
   return;
  }
  if(c.hasAttribute("data-missao")){
   var ch=c.getAttribute("data-missao"), i=mIndex(ch);
   e.stopPropagation(); e.preventDefault();
   if(!liberada(i)){
    alert("A missão "+(i+1)+" abre quando a missão "+i+" terminar.");
    return;
   }
   grav("modo","missoes"); grav("atual", ch);
   var r=mDe(ch).rota;
   vai(r[0]);
   setTimeout(ciclo,60);
  }
 }, true);

 /* Avancar e Voltar · captura no document, antes do #nav da NAV.OF */
 document.addEventListener("click", function(e){
  /* V01.02 · o guarda e a ROTA, nao o modo.
     rota() devolve: a pre-rota antes da escolha, a rota da missao
     em modo missoes, e null em aula por aula. Com "modo!==missoes"
     a pre-escolha escapava daqui e o LIVRE da NAV.OF avancava. */
  if(!rota()) return;                            /* aula por aula: LIVRE intacto */
  var b=e.target;
  while(b && b!==document && !(b.id==="bAvanca" || b.id==="bVolta")) b=b.parentNode;
  if(!b || b===document) return;
  if(b.id==="bAvanca" && perguntaAberta()){
   e.stopPropagation(); e.preventDefault();
   pintaAvanca();
   alert("Responda a pergunta desta tela antes de avançar.");
   return;
  }
  if(anda(b.id==="bAvanca" ? 1 : -1)){
   e.stopPropagation(); e.preventDefault();
   setTimeout(ciclo,60);
  }
 }, true);

 /* V01.05 · o botao (?) do card numerado · comportamento de origem.
    O NAV.07-REV abre JANELA, nao caixa embutida: a .cxaj fica oculta
    no lugar, so como fonte do texto, e o clique monta um .ajov por
    cima. Reproduzido como veio.
    🔴 O pacote de origem nao trazia o fechamento: os botoes .ajov-x
    e .ajov-ok existem no HTML e ninguem os liga. Sem isso a janela
    abre e nao fecha. Acrescentei X, "entendi", clique fora e Esc.
    Se o REVISAO mandar a versao dele, trocar por ela. */
 function abrirJanelaAjuda(id){
  var c=document.getElementById("aj_"+id);
  if(!c || document.getElementById("ajov")) return;
  var t=c.querySelector(".cxaj-t").innerHTML, p=c.querySelector(".cxaj-c").innerHTML;
  var ov=document.createElement("div");
  ov.className="ajov"; ov.id="ajov";
  ov.innerHTML='<div class="ajov-cx" role="dialog" aria-modal="true">'
   + '<button class="ajov-x" id="ajovX" type="button" aria-label="fechar">✕</button>'
   + '<div class="ajov-t">'+t+'</div><div class="ajov-c">'+p+'</div>'
   + '<button class="ajov-ok" id="ajovOk" type="button">entendi</button></div>';
  document.body.appendChild(ov);
  function fechaAj(){
   var o=document.getElementById("ajov");
   if(o) o.parentNode.removeChild(o);
   document.removeEventListener("keydown", porEsc, true);
  }
  function porEsc(e){ if(e.key==="Escape"){ e.stopPropagation(); fechaAj() } }
  ov.querySelector("#ajovX").addEventListener("click", fechaAj);
  ov.querySelector("#ajovOk").addEventListener("click", fechaAj);
  ov.addEventListener("click", function(e){ if(e.target===ov) fechaAj() });
  document.addEventListener("keydown", porEsc, true);
  var ok=ov.querySelector("#ajovOk"); if(ok) ok.focus();
 }
 document.addEventListener("click", function(ev){
  var b = ev.target.closest && ev.target.closest(".btaj");
  if(!b) return;
  ev.preventDefault(); ev.stopPropagation();
  abrirJanelaAjuda(b.getAttribute("data-aj"));
 });

 /* V01.06 · selo de ORIGEM DA IMAGEM na lista de telas.
    O NAV.07-REV deduz a categoria de pedacos do codigo da questao.
    Aqui ela vem declarada no conteudo (campo "origem" da figura),
    entao a camada so le. Uma tela pode ter dois selos: a captura da
    plataforma e o desenho reconstruido aparecem na mesma tela, e e
    ai que o estudante precisa saber qual e qual. */
 var SELO = {original:["🔎","imagem da plataforma",""],
             reconstruido:["🏗️","reconstruído",""],
             criado:["🧱⚒️","criado do zero"," criadomk"]};
 function origensDaTela(i){
  var t=null, n=0;
  (D.aulas||[]).forEach(function(a){ (a.telas||[]).forEach(function(x){
    if(n===i) t=x; n++; }) });
  if(!t) return [];
  var fora=[];
  (t.blocos||[]).forEach(function(b){
   if(b.origem && fora.indexOf(b.origem)<0) fora.push(b.origem);
  });
  return fora;
 }
 function seloNaLista(){
  document.querySelectorAll("#cx .it[data-ir2]").forEach(function(it){
   if(it.getAttribute("data-selo")==="1") return;
   it.setAttribute("data-selo","1");
   var ori=origensDaTela(+it.getAttribute("data-ir2"));
   if(!ori.length) return;
   var num=it.querySelector(".num");
   if(!num) return;
   var h="";
   ori.forEach(function(o){
    var s=SELO[o]; if(!s) return;
    h+='<span class="lupamk'+s[2]+'" title="'+s[1]+'">'+s[0]+'</span>';
   });
   num.insertAdjacentHTML("afterend", h);
  });
 }

 /* a lista abre · filtra depois que a NAV.OF arruma os cards */
 document.addEventListener("click", function(e){
  if(e.target && e.target.id==="bLista"){ setTimeout(filtraLista,160); setTimeout(seloNaLista,200) }
 });

 document.addEventListener("click", function(){ setTimeout(ciclo,80) });
 document.addEventListener("change", function(){ setTimeout(pintaAvanca,40) });
 window.addEventListener("resize", encaixaFaixa);
 setInterval(ciclo, 1500);
 ciclo();
}

if(document.readyState==="loading"){
 document.addEventListener("DOMContentLoaded", function(){ setTimeout(partida,20) });
}else{ setTimeout(partida,20) }
})();
